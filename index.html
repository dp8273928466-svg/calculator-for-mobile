<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calca - Mobile Calculator</title>
    <style>
        /* Lock screen height and remove whole-page scrollbars */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden; /* Prevents whole-page scrolling */
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            background: #0f172a;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
        }

        /* Screen Display */
        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 16px 8px;
            word-break: break-all;
        }

        .expression {
            font-size: 1.1rem;
            color: #64748b;
            min-height: 1.4rem;
            margin-bottom: 4px;
        }

        .result {
            font-size: 3rem;
            font-weight: 300;
            color: #f8fafc;
            line-height: 1.1;
        }

        /* Keypad Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding-bottom: 8px;
        }

        .btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            font-size: 1.4rem;
            font-weight: 500;
            color: #f8fafc;
            background-color: #1e293b;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.1s, transform 0.05s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            opacity: 0.7;
            transform: scale(0.95);
        }

        .btn-func {
            background-color: #334155;
            color: #38bdf8;
        }

        .btn-op {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn-zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 40px;
            justify-content: flex-start;
            padding-left: 28px;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        /* History Drawer */
        .history-drawer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            z-index: 10;
            display: flex;
            flex-direction: column;
            transform: translateY(-100%);
            transition: transform 0.3s ease-in-out;
            padding: 16px;
        }

        .history-drawer.open {
            transform: translateY(0);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e293b;
        }

        .history-list {
            flex: 1;
            overflow-y: auto; /* Internal scrollbar only when history fills screen */
            padding: 16px 0;
        }

        .history-item {
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
            text-align: right;
            cursor: pointer;
        }

        .history-item .hist-exp {
            font-size: 0.9rem;
            color: #64748b;
        }

        .history-item .hist-res {
            font-size: 1.4rem;
            color: #38bdf8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <span class="app-title">Calca</span>
            <button class="icon-btn" id="history-toggle" aria-label="Toggle History">🕒</button>
        </div>

        <!-- Display -->
        <div class="display-container">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <!-- Keypad -->
        <div class="keypad">
            <button class="btn btn-func" onclick="clearAll()">AC</button>
            <button class="btn btn-func" onclick="deleteLast()">⌫</button>
            <button class="btn btn-func" onclick="appendOp('%')">%</button>
            <button class="btn btn-op" onclick="appendOp('÷')">÷</button>

            <button class="btn" onclick="appendNum('7')">7</button>
            <button class="btn" onclick="appendNum('8')">8</button>
            <button class="btn" onclick="appendNum('9')">9</button>
            <button class="btn btn-op" onclick="appendOp('×')">×</button>

            <button class="btn" onclick="appendNum('4')">4</button>
            <button class="btn" onclick="appendNum('5')">5</button>
            <button class="btn" onclick="appendNum('6')">6</button>
            <button class="btn btn-op" onclick="appendOp('-')">-</button>

            <button class="btn" onclick="appendNum('1')">1</button>
            <button class="btn" onclick="appendNum('2')">2</button>
            <button class="btn" onclick="appendNum('3')">3</button>
            <button class="btn btn-op" onclick="appendOp('+')">+</button>

            <button class="btn btn-zero" onclick="appendNum('0')">0</button>
            <button class="btn" onclick="appendDot('.')">.</button>
            <button class="btn btn-op" onclick="calculate()">=</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            Deepak - Developer
        </div>

        <!-- History Drawer Overlay -->
        <div class="history-drawer" id="history-drawer">
            <div class="history-header">
                <h3>Calculation History</h3>
                <button class="icon-btn" id="history-close">✕</button>
            </div>
            <div class="history-list" id="history-list">
                <!-- History items populate here -->
            </div>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let expressionStr = '';
        let history = [];

        const resultEl = document.getElementById('result');
        const expressionEl = document.getElementById('expression');
        const historyDrawer = document.getElementById('history-drawer');
        const historyList = document.getElementById('history-list');

        function triggerHaptic() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        function updateDisplay() {
            resultEl.innerText = currentInput;
            expressionEl.innerText = expressionStr;
        }

        function appendNum(num) {
            triggerHaptic();
            if (currentInput === '0') {
                currentInput = num;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendDot() {
            triggerHaptic();
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function appendOp(op) {
            triggerHaptic();
            expressionStr = `${currentInput} ${op} `;
            currentInput = '0';
            updateDisplay();
        }

        function clearAll() {
            triggerHaptic();
            currentInput = '0';
            expressionStr = '';
            updateDisplay();
        }

        function deleteLast() {
            triggerHaptic();
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function calculate() {
            triggerHaptic();
            if (!expressionStr) return;

            const fullExpr = expressionStr + currentInput;
            let sanitizedExpr = fullExpr.replace(/×/g, '*').replace(/÷/g, '/');

            try {
                let evalResult = Function(`'use strict'; return (${sanitizedExpr})`)();
                evalResult = Math.round(evalResult * 1000000) / 1000000;

                // Add to history
                history.unshift({ expr: fullExpr, res: evalResult });
                renderHistory();

                currentInput = String(evalResult);
                expressionStr = '';
                updateDisplay();
            } catch (e) {
                resultEl.innerText = 'Error';
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<div class="hist-exp">${item.expr}</div><div class="hist-res">${item.res}</div>`;
                div.onclick = () => {
                    currentInput = String(item.res);
                    updateDisplay();
                    historyDrawer.classList.remove('open');
                };
                historyList.appendChild(div);
            });
        }

        // Drawer Controls
        document.getElementById('history-toggle').onclick = () => historyDrawer.classList.add('open');
        document.getElementById('history-close').onclick = () => historyDrawer.classList.remove('open');

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNum(e.key);
            if (e.key === '.') appendDot();
            if (e.key === '+') appendOp('+');
            if (e.key === '-') appendOp('-');
            if (e.key === '*') appendOp('×');
            if (e.key === '/') appendOp('÷');
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') clearAll();
        });
    </script>
</body>
</html>
